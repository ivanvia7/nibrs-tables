name: data
# Builds the web page files for every year, one job per year, and keeps them in one
# release per year (web-data-YYYY). Runs only when the parser changes, because a full
# build downloads every FBI zip; the pages workflow reuses the stored files.
on:
  push:
    branches: [main]
    paths: [src/**, scripts/build_web_data.py, .github/workflows/data.yml]
  workflow_dispatch:

permissions:
  contents: write

env:
  STATES: AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY

jobs:
  year:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6  # 20+ years at once made the FBI API drop connections
      matrix:
        year: [1997, 1998, 1999, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009,
               2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022,
               2023, 2024, 2025]
    env:
      YEAR: ${{ matrix.year }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra parquet
      - uses: actions/cache@v4
        with:
          path: cache
          key: nibrs-zips-${{ matrix.year }}
      - run: uv run python scripts/build_web_data.py $(for s in $STATES; do echo "$s-$YEAR"; done)
      - run: |
          tag="web-data-$YEAR"
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --latest=false \
            --title "Web page files $YEAR" --notes "Offense files the web page loads for $YEAR, in one tar."
          # One file per year: 51 files a year made 1,500 API calls a run, over the 1,000 an hour limit.
          tar -cf "web-data-$YEAR.tar" -C web/data $(cd web/data && ls *.parquet)
          gh release upload "$tag" "web-data-$YEAR.tar" --clobber
