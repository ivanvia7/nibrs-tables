name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  YEAR: 2023
  STATES: AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra parquet
      # FBI zips are cached between runs, so a push only rebuilds, it does not re-download.
      - uses: actions/cache@v4
        with:
          path: cache
          key: nibrs-zips-${{ env.YEAR }}
      - run: uv run python scripts/build_web_data.py $(for s in $STATES; do echo "$s-$YEAR"; done)
      - run: du -sh web/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
