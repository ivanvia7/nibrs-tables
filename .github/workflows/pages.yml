name: pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [data]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra parquet
      # The data workflow keeps one release of built files per year.
      - run: |
          for tag in $(gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^web-data-'); do
            gh release download "$tag" --dir web/data --pattern '*.parquet' --clobber
          done
      - run: uv run python scripts/build_web_data.py
      - run: du -sh web/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
